# Shared Mac and SSH configuration. Plain text; no font-dependent symbols.
set -g default-terminal "tmux-256color"
set -g history-limit 20000
set -sg escape-time 50
set -g focus-events on
set -g mouse on
set -g display-time 2000
set -g mode-keys vi
set -g set-clipboard external
set -g exit-unattached off
set -g destroy-unattached off

# Keep Ctrl-B, including Ctrl-B b for a nested SSH tmux.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "tmux configuration reloaded"
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
if-shell 'test "$(uname -s)" = Darwin' 'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"; bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"'

set -g status-style "bg=default,fg=colour250"
set -g status-left "[#S] "
set -g status-left-length 40
set -g status-right "#{?client_prefix,PREFIX | ,}#{host_short} | %Y-%m-%d %H:%M"
set -g status-right-length 60
set -g window-status-format "#I:#W#F"
set -g window-status-current-format "[#I:#W#F]"
set -g window-status-current-style "fg=colour220,bold"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour70"
